services:
  - type: web
    name: wherewas
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && PLAYWRIGHT_BROWSERS_PATH=0 python -m playwright install chromium
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: GEMINI_API_KEY
        sync: false
      - key: MAPILLARY_ACCESS_TOKEN
        sync: false
      - key: WHEREWAS_LIGHTWEIGHT
        value: "1"
